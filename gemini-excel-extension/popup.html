<!DOCTYPE html>
<html>
<head>
  <script src="xlsx.full.min.js"></script>
</head>
<body style="width:260px;font-family:sans-serif;padding:10px">
  <input type="file" id="file" accept=".xlsx">
  <div style="margin-top:10px">
    <label>From # <input type="number" id="from" style="width:60px"></label>
    <label>To # <input type="number" id="to" style="width:60px"></label>
  </div>
  <button id="start" style="margin-top:10px">Start Sending</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
